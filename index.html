<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luxembourg Monitor</title>
  <meta name="description" content="The 100 communes of Luxembourg in open data, with an AI that answers from the data. By Beyond Data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..800&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/bdg.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="topbar lm-top">
    <a class="brand" href="#/"><b>Luxembourg <i>Monitor</i></b><span data-i18n="byline">by Beyond Data</span></a>
    <form class="lm-search" id="search" role="search">
      <label class="sr-only" for="search-input" data-i18n="search.label">Find a commune</label>
      <input id="search-input" list="commune-list" autocomplete="off" data-i18n-placeholder="search.placeholder">
      <datalist id="commune-list"></datalist>
    </form>
    <nav class="lm-nav">
      <a class="btn small lm-navbtn" href="#/ask" data-i18n="ask.title">Ask the data</a>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </nav>
  </header>
  <main class="lm-main">
    <section class="lm-mapwrap">
      <svg id="map" role="img" aria-label="Map of the 100 communes of Luxembourg"></svg>
      <div id="attract" class="lm-attract" hidden aria-live="polite"></div>
    </section>
    <section id="panel" class="lm-panel" aria-live="polite"></section>
  </main>
  <footer class="lm-foot">
    <span data-i18n="foot.sources">Open data: STATEC · RNPP national register · Observatoire de l'Habitat · ACT</span>
    · <span data-i18n="built">Built from open data by AI agents.</span>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
